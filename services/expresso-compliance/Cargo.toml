[package]
name = "expresso-compliance"
publish = false
version = "0.1.0"
edition = "2021"
description = "Audit, eDiscovery, DLP, Sensitivity Labels"

[[bin]]
name = "expresso-compliance"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
zip  = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex  = { workspace = true }

# Internal libs
expresso-core = { path = "../../libs/expresso-core", package = "expresso-core" }
expresso-observability = { workspace = true }
expresso-auth-client = { path = "../../libs/expresso-auth-client", package = "expresso-auth-client" }

[dev-dependencies]
tokio-test = "0.4"

[package.metadata.cargo-machete]
# Used via macros/features/lib-rename that machete's source scan can't see.
ignored = ["async-trait"]
