name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust — fmt / clippy / tests / deny / machete
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expresso_test
          POSTGRES_USER: expresso
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          DATABASE_URL: postgres://expresso:test@localhost:5432/expresso_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --workspace

      - name: cargo-deny (bans + sources + advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources advisories licenses

      - name: cargo-machete (unused deps)
        uses: bnjbvr/cargo-machete@main

      - name: lizard (CCN ≤ 25)
        run: |
          pip install lizard --quiet
          find services libs -name '*.rs' -not -path '*/target/*' \
            | xargs lizard -l rust -C 25 -w

      - name: jscpd (duplication < 5%)
        run: |
          npm install -g jscpd --silent
          jscpd --min-lines 50 --min-tokens 100 --threshold 5 \
                --reporters console --silent services/ libs/

  frontend:
    name: Frontend — TypeCheck + Lint + Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r build

  shellcheck:
    name: Shell — shellcheck scripts/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: './scripts'

  rustdoc:
    name: Rust — cargo doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
