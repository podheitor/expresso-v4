[package]
name = "expresso-drive"
publish = false
version = "0.1.0"
edition = "2021"
description = "WebDAV server + file sync API"

[lib]
name = "expresso_drive"
path = "src/lib.rs"

[[bin]]
name = "expresso-drive"
path = "src/main.rs"

[features]
# Exposes `fuzz_entry` for the cargo-fuzz harness. text_extract is a pure
# bytes->text API, so no extra deps are needed (no tempfile).
fuzzing = []

[dependencies]
tokio              = { workspace = true }
axum               = { workspace = true, features = ["multipart"] }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
uuid               = { workspace = true }
time               = { workspace = true }
sha2               = { workspace = true }
sqlx               = { workspace = true }
rand               = { workspace = true }
base64             = { workspace = true }
hmac               = { workspace = true }
hex                = { workspace = true }
zip                = { workspace = true }
lopdf              = { workspace = true }
reqwest            = { workspace = true }
prometheus         = { workspace = true }
once_cell          = { workspace = true }

expresso-core        = { path = "../../libs/expresso-core", package = "expresso-core" }
expresso-observability = { workspace = true }
expresso-auth-client = { path = "../../libs/expresso-auth-client", package = "expresso-auth-client" }
