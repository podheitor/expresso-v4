[package]
name = "expresso-notes"
publish = false
version = "0.1.0"
edition = "2021"
description = "Notes / memo CRUD service (tenant-scoped)"

[[bin]]
name = "expresso-notes"
path = "src/main.rs"

[dependencies]
tokio                  = { workspace = true }
axum                   = { workspace = true }
tower-http             = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
tracing                = { workspace = true }
anyhow                 = { workspace = true }
thiserror              = { workspace = true }
uuid                   = { workspace = true }
time                   = { workspace = true }
sqlx                   = { workspace = true }
reqwest                = { workspace = true }

expresso-core          = { path = "../../libs/expresso-core" }
expresso-observability = { workspace = true }
expresso-auth-client   = { path = "../../libs/expresso-auth-client" }
