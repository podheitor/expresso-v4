[package]
name = "expresso-notifications"
publish = false
version = "0.1.0"
edition = "2021"
description = "Push notifications (Web Push, email alerts)"

[[bin]]
name = "expresso-notifications"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
deadpool-redis = { workspace = true }
once_cell = { workspace = true }
sqlx = { workspace = true }

# WebPush message building (VAPID ES256 + aes128gcm payload encryption).
# No client feature — requests go out through the existing reqwest client.
web-push = { version = "0.11", default-features = false }

# Internal libs
expresso-core = { path = "../../libs/expresso-core", package = "expresso-core" }
expresso-observability = { workspace = true }
expresso-auth-client = { path = "../../libs/expresso-auth-client", package = "expresso-auth-client" }

[dev-dependencies]
tokio-test = "0.4"

[package.metadata.cargo-machete]
# Used via macros/features/lib-rename that machete's source scan can't see.
ignored = ["async-trait"]
