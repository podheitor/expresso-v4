name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust — fmt / clippy / tests / deny / machete
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expresso_test
          POSTGRES_USER: expresso
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # .cargo/config.toml pins `-fuse-ld=mold` for fast local builds; the
      # runner image has no mold, so install it or every cargo step fails at
      # the first link with "cc: unrecognized -fuse-ld=mold".
      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          DATABASE_URL: postgres://expresso:test@localhost:5432/expresso_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --workspace

      - name: cargo-deny (bans + sources + advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources advisories licenses

      - name: cargo-machete (unused deps)
        uses: bnjbvr/cargo-machete@main

      # Legacy baseline: 21 bloat-era functions exceed CCN 25 (max 72:
      # imap cmd_fetch, smtp handle_tls). Per CLAUDE.md, start the gate at the
      # current max and ratchet down by 5 per refactor. See docs/COMPLEXITY_DEBT.md.
      # -C 37: legacy CCN max, ratcheting toward 25 (72→…→38→37; the two
      # structural blockers are done — handle@session STARTTLS prelude + cmd_fetch
      # \Seen update both extracted). -L 1000: lizard's default function-length
      # cap. (The iCal string-building fns that emit many `\r\n` literals — which
      # used to make lizard's Rust tokenizer miscount the preceding fn's length
      # into the thousands and forced -L up to 8000 — now live in their own small
      # web/src/ical.rs module, so the miscount can't span into routes.rs.)
      - name: lizard (CCN ≤ 37, ratcheting toward 25)
        run: |
          pip install lizard --quiet
          find services libs -name '*.rs' -not -path '*/target/*' \
            | xargs lizard -l rust -C 37 -L 1000 -w

      - name: jscpd (duplication < 5%)
        # Pinned to 4.x — the 5.0.x line (released 2026-06-08) breaks the
        # global-install step on the runner; bump deliberately, not via latest.
        run: |
          npm install -g jscpd@4 --silent
          jscpd --min-lines 50 --min-tokens 100 --threshold 5 \
                --reporters console --silent services/ libs/

  # NOTE: the "Frontend — TypeCheck + Lint + Build" job was removed — there is
  # no frontend source committed to the repo (only a stub root package.json;
  # no pnpm-lock.yaml, no packages), so `pnpm install`/`pnpm -r` had nothing to
  # run and failed on the missing lockfile. The SvelteKit app under
  # frontend/expresso-web/ exists only as gitignored build artifacts locally.
  # Restore this job once real frontend source (with a committed pnpm-lock.yaml)
  # lands in the repository.

  shellcheck:
    name: Shell — shellcheck scripts/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: './scripts'

  rustdoc:
    name: Rust — cargo doc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # See note in the `rust` job: .cargo/config.toml requires mold.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
