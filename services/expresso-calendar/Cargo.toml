[package]
name = "expresso-calendar"
publish = false
version = "0.1.0"
edition = "2021"
description = "CalDAV server + meeting management"

[[bin]]
name = "expresso-calendar"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
quick-xml = { workspace = true }
base64 = { workspace = true }
prometheus = { workspace = true }
once_cell  = { workspace = true }
reqwest     = { workspace = true }
urlencoding = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
lettre = { workspace = true }
async-nats = "0.37"

# Internal libs
expresso-core = { path = "../../libs/expresso-core", package = "expresso-core" }
expresso-observability = { workspace = true }
expresso-auth-client = { path = "../../libs/expresso-auth-client", package = "expresso-auth-client" }
sqlx = { workspace = true }

[features]
fuzzing = ["dep:tempfile"]

[dependencies.tempfile]
version  = "3"
optional = true

[dev-dependencies]
tokio-test = "0.4"

[package.metadata.cargo-machete]
# Used via macros/features/lib-rename that machete's source scan can't see.
ignored = ["async-trait", "tempfile"]
