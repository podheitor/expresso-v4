[package]
name = "expresso-search"
publish = false
version = "0.1.0"
edition = "2021"
description = "Full-text search service (Tantivy)"

[[bin]]
name = "expresso-search"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tantivy = { workspace = true }

# Internal libs
expresso-observability = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
