<!doctype html>
<html lang="pt-BR" id="expresso-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expresso{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script>
  // Apply theme immediately (before render) to avoid flash
  (function() {
    var t = localStorage.getItem('expresso_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
</head>
<body>
  {% block nav %}{% endblock %}
  {% block body %}{% endblock %}
  <!-- Atalhos de teclado globais (? para ajuda) -->
  <div id="shortcut-help" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);align-items:center;justify-content:center" onclick="this.style.display='none'">
    <div style="background:var(--bg-card,var(--bg));border-radius:var(--radius);padding:1.5rem 2rem;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.4)">
      <h3 style="margin-top:0">Atalhos de teclado</h3>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <tr><td class="mono" style="padding:.2rem .5rem">G M</td><td>Ir para Mail</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G C</td><td>Ir para Chat</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G A</td><td>Ir para Agenda</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G D</td><td>Ir para Drive</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G K</td><td>Ir para Contatos</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G T</td><td>Ir para Tarefas</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G H</td><td>Ir para Início</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">/</td><td>Busca global</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">?</td><td>Mostrar esta ajuda</td></tr>
      </table>
      <p class="muted small" style="margin-bottom:0">Clique em qualquer lugar para fechar.</p>
    </div>
  </div>
  <script>
  // Apply saved accent color
  (function() {
    var c = localStorage.getItem('expresso_accent_color');
    if (c) document.documentElement.style.setProperty('--accent', c);
  })();
  // Theme toggle API (callable from any page)
  window.toggleTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('expresso_theme', next);
    document.querySelectorAll('[data-theme-label]').forEach(function(el){ el.textContent = next === 'dark' ? '☀ Claro' : '🌙 Escuro'; });
  };
  window.applyTheme = function(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('expresso_theme', t);
  };
  (function() {
    var _g = false;
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
      if (e.key === '/') {
        var search = document.getElementById('topbar-search');
        if (search) { e.preventDefault(); search.focus(); search.select(); }
        return;
      }
      if (e.key === '?') { document.getElementById('shortcut-help').style.display = 'flex'; return; }
      if (e.key === 'g' || e.key === 'G') { _g = true; setTimeout(function(){ _g = false; }, 1500); return; }
      if (_g) {
        _g = false;
        var nav = { m: '/mail', c: '/chat', a: '/calendar', d: '/drive', k: '/contacts', t: '/tasks', h: '/' };
        var k = e.key.toLowerCase();
        if (nav[k]) { window.location.href = nav[k]; }
      }
    });
  })();
  </script>
</body>
</html>
