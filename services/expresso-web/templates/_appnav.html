<header class="topbar">
  <a class="brand" href="/">Expresso</a>
  <nav class="appnav">
    <a class="appnav-item{% if current == "mail"     %} active{% endif %}" href="/mail"     accesskey="1" title="Alt+1 / g+m">Mail<span class="appnav-badge" id="mail-appnav-badge" style="display:none"></span></a>
    <a class="appnav-item{% if current == "calendar" %} active{% endif %}" href="/calendar" accesskey="2" title="Alt+2 / g+c">Agenda</a>
    <a class="appnav-item{% if current == "contacts" %} active{% endif %}" href="/contacts" accesskey="3" title="Alt+3">Contatos</a>
    <a class="appnav-item{% if current == "drive"    %} active{% endif %}" href="/drive"    accesskey="4" title="Alt+4 / g+d">Drive</a>
    <a class="appnav-item{% if current == "chat"     %} active{% endif %}" href="/chat"     accesskey="5" title="Alt+5">Chat</a>
    <a class="appnav-item{% if current == "meet"     %} active{% endif %}" href="/meet"     accesskey="6" title="Alt+6">Meet</a>
    <a class="appnav-item{% if current == "tasks"    %} active{% endif %}" href="/tasks"    accesskey="7" title="Alt+7 / g+t">Tarefas<span class="appnav-badge" id="tasks-appnav-badge" style="display:none"></span></a>
    <a class="appnav-item{% if current == "notes"    %} active{% endif %}" href="/notes"    accesskey="8" title="Alt+8">Notas</a>
  </nav>
  <div class="topbar-search-wrap">
    <input type="search" id="topbar-search" class="topbar-search-input" placeholder="🔍 Buscar…"
           autocomplete="off" onkeydown="if(event.key==='Enter')topbarSearch(this.value)"
           oninput="topbarSearchInput(this.value)">
    <ul class="topbar-search-results" id="topbar-search-results" style="display:none"></ul>
  </div>
  <div class="useract">
    <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">☀</button>
    <div class="notif-bell-wrap" style="position:relative">
      <button class="appnav-item" id="notif-bell" title="Notificações" aria-label="Notificações"
              onclick="toggleNotifPanel()" style="position:relative;padding:.3rem .45rem">
        🔔<span class="notif-badge" id="notif-badge" style="display:none"></span>
      </button>
      <div class="notif-panel" id="notif-panel" style="display:none">
        <div class="notif-panel-header">Notificações</div>
        <ul class="notif-list" id="notif-list">
          <li class="notif-item muted small">Nenhuma notificação.</li>
        </ul>
        <div class="notif-panel-footer">
          <button class="btn btn-ghost btn-sm" onclick="clearNotifs()">Limpar tudo</button>
        </div>
      </div>
    </div>
    {% if me.is_admin() %}
      <a class="appnav-item appnav-admin" href="/admin" title="Painel Admin">⚙ Admin</a>
    {% endif %}
    <a class="appnav-item{% if current == "settings" %} active{% endif %}" href="/settings" title="Configurações" aria-label="Configurações">⚙</a>
    <a class="appnav-item useract-user" href="/me">{{ me.email }}</a>
  </div>
</header>
<script>
(function(){
  var btn = document.getElementById('themeToggle');
  var root = document.documentElement;
  // Unify with expresso_theme key (base.html already applied it before paint)
  var stored = localStorage.getItem('expresso_theme') || localStorage.getItem('theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function apply(t){
    root.setAttribute('data-theme', t);
    localStorage.setItem('expresso_theme', t);
    localStorage.setItem('theme', t);
    if (btn) btn.textContent = t === 'dark' ? '☀' : '☾';
    document.querySelectorAll('[data-theme-label]').forEach(function(el){ el.textContent = t === 'dark' ? '☀ Claro' : '🌙 Escuro'; });
  }
  apply(stored);
  if (btn) btn.addEventListener('click', function(){ apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
})();

// ── Top-nav global search ─────────────────────────────────────────────────────
var _tbTimer;
function topbarSearchInput(q) {
  clearTimeout(_tbTimer);
  var res = document.getElementById('topbar-search-results');
  if (!q || q.length < 2) { res.style.display = 'none'; return; }
  _tbTimer = setTimeout(function() {
    // Federate across endpoints
    var searches = [
      { label: 'Mail', url: '/api/v1/mail/search?q=' + encodeURIComponent(q) + '&limit=3', icon: '✉', path: function(r){ return '/mail/' + r.id; }, text: function(r){ return r.subject || r.preview_text || r.from_addr; } },
      { label: 'Chat', url: '/api/v1/messages/search?q=' + encodeURIComponent(q) + '&limit=3', icon: '💬', path: function(r){ return '/chat/channels/' + r.channel_id; }, text: function(r){ return r.body; } },
      { label: 'Drive', url: '/api/v1/drive/search?q=' + encodeURIComponent(q) + '&limit=3', icon: '📄', path: function(r){ return '/drive'; }, text: function(r){ return r.name; } },
    ];
    var items = [];
    var done = 0;
    function render() {
      if (!items.length) { res.style.display = 'none'; return; }
      res.innerHTML = items.slice(0, 9).map(function(i) {
        return '<li><a class="topbar-search-item" href="' + i.href + '">' +
          '<span class="topbar-search-icon">' + i.icon + '</span>' +
          '<span class="topbar-search-text">' + escHtml(i.text) + '</span>' +
          '<span class="topbar-search-cat muted small">' + i.cat + '</span>' +
          '</a></li>';
      }).join('');
      res.style.display = '';
    }
    searches.forEach(function(s) {
      fetch(s.url, {credentials:'include'})
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(rows) {
          (rows || []).forEach(function(r) {
            items.push({ icon: s.icon, cat: s.label, text: (s.text(r) || '').slice(0,60), href: s.path(r) });
          });
        }).catch(function(){})
        .then(function() { done++; if (done === searches.length) render(); });
    });
  }, 250);
}
function topbarSearch(q) {
  if (!q.trim()) return;
  window.location.href = '/search?q=' + encodeURIComponent(q.trim());
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
document.addEventListener('click', function(e) {
  if (!e.target.closest('.topbar-search-wrap')) {
    var r = document.getElementById('topbar-search-results');
    if (r) r.style.display = 'none';
  }
  if (!e.target.closest('.notif-bell-wrap')) {
    var p = document.getElementById('notif-panel');
    if (p) p.style.display = 'none';
  }
});

// ── Notification bell ─────────────────────────────────────────────────────────
var NOTIF_KEY = 'expresso_notifs';
function loadNotifs() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch(e) { return []; } }
function saveNotifs(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }

function toggleNotifPanel() {
  var p = document.getElementById('notif-panel');
  if (!p) return;
  var open = p.style.display !== 'none';
  p.style.display = open ? 'none' : '';
  if (!open) renderNotifList();
}

function renderNotifList() {
  var list = document.getElementById('notif-list');
  if (!list) return;
  var notifs = loadNotifs().slice(0, 20);
  var badge = document.getElementById('notif-badge');
  var unread = notifs.filter(function(n){ return !n.read; }).length;
  if (badge) { badge.textContent = unread > 0 ? unread : ''; badge.style.display = unread > 0 ? '' : 'none'; }
  if (!notifs.length) { list.innerHTML = '<li class="notif-item muted small">Nenhuma notificação.</li>'; return; }
  list.innerHTML = notifs.map(function(n, i) {
    return '<li class="notif-item' + (n.read ? '' : ' notif-unread') + '" onclick="markNotifRead(' + i + ')">' +
      '<span class="notif-icon">' + escHtml(n.icon || '🔔') + '</span>' +
      '<div class="notif-content">' +
        '<span class="notif-body">' + escHtml(n.body || '') + '</span>' +
        '<span class="notif-time muted small">' + (n.ts ? new Date(n.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '') + '</span>' +
      '</div>' +
    '</li>';
  }).join('');
  notifs.forEach(function(n){ n.read = true; });
  saveNotifs(notifs);
}

function markNotifRead(idx) {
  var notifs = loadNotifs();
  if (notifs[idx]) notifs[idx].read = true;
  saveNotifs(notifs);
  renderNotifList();
}

function clearNotifs() { saveNotifs([]); renderNotifList(); }

// Push a notification from anywhere

// Init badge on page load
(function() {
  var notifs = loadNotifs();
  var unread = notifs.filter(function(n){ return !n.read; }).length;
  var badge = document.getElementById('notif-badge');
  if (badge) { badge.textContent = unread > 0 ? unread : ''; badge.style.display = unread > 0 ? '' : 'none'; }
})();

// ── Tasks badge from localStorage ────────────────────────────────────────────
(function() {
  var n = parseInt(localStorage.getItem('expresso_tasks_today_count') || '0', 10);
  var badge = document.getElementById('tasks-appnav-badge');
  if (badge) { badge.textContent = n || ''; badge.style.display = n > 0 ? '' : 'none'; }
})();

// ── Mail badge polling (unread INBOX) ───────────────────────────────────────
(function pollMailUnread() {
  var badge = document.getElementById('mail-appnav-badge');
  if (!badge) return;
  function refresh() {
    fetch('/api/v1/mail/folders/INBOX/unread-count', { credentials: 'include' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j) {
        if (!j) return;
        var n = parseInt(j.count || j.unread || 0, 10);
        try { localStorage.setItem('expresso_mail_unread', String(n)); } catch(e){}
        badge.textContent = n > 99 ? '99+' : (n || '');
        badge.style.display = n > 0 ? '' : 'none';
      }).catch(function(){});
  }
  // Seed from cached value to avoid flicker
  var cached = parseInt(localStorage.getItem('expresso_mail_unread') || '0', 10);
  if (cached > 0) { badge.textContent = cached > 99 ? '99+' : cached; badge.style.display = ''; }
  refresh();
  setInterval(function() {
    if (document.visibilityState === 'visible') refresh();
  }, 60000);
})();

// ── Global keyboard shortcuts ────────────────────────────────────────────────
(function() {
  var SHORTCUTS_KEY = 'expresso_shortcuts_enabled';
  var _gPrefix = false;
  var _gTimer  = 0;
  document.addEventListener('keydown', function(e) {
    if (localStorage.getItem(SHORTCUTS_KEY) === '0') return;
    var tag = (document.activeElement || {}).tagName || '';
    if (['INPUT','TEXTAREA','SELECT'].indexOf(tag) >= 0) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key.toUpperCase();
    if (_gPrefix) {
      _gPrefix = false;
      clearTimeout(_gTimer);
      var nav = { M: '/mail', C: '/chat', K: '/calendar', D: '/drive', T: '/tasks', P: '/contacts' };
      if (nav[key]) { window.location.href = nav[key]; }
      return;
    }
    if (key === 'G') {
      _gPrefix = true;
      _gTimer = setTimeout(function(){ _gPrefix = false; }, 1500);
      return;
    }
    // Single-key shortcuts
    if (key === 'C' && window.location.pathname.startsWith('/mail')) {
      window.location.href = '/mail/compose';
    } else if (key === '?') {
      window.location.href = '/settings?tab=shortcuts';
    }
  });
})();
</script>
