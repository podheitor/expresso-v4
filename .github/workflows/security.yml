name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC — stagger vs other cron jobs
    - cron: '17 3 * * *'

jobs:
  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # .cargo/config.toml pins -fuse-ld=mold; install it so cargo install links.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet
      - name: Audit advisories
        # cargo-audit reads ignores from ~/.cargo/audit.toml, not the repo root;
        # stage the versioned audit.toml there. Rationale is documented inline
        # in that file + docs/LICENSING_NOTES.md.
        run: |
          mkdir -p ~/.cargo
          cp audit.toml ~/.cargo/audit.toml
          cargo audit

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Still on Node 20 (latest is v2.3.3); upstream has no Node-24 release yet.
      # Harmless deprecation warning until 2026-09-16 — bump when one ships
      # rather than forcing FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 on an untested action.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  miri:
    name: Miri (UB — pure-logic modules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Run Miri on pure-logic libs
        run: |
          # Miri cannot simulate C FFI; scope to FFI-free crates only.
          # Expand this list as FFI is removed from other crates.
          for crate in expresso-crypto expresso-mail-parser; do
            cargo +nightly miri test \
              --manifest-path "libs/${crate}/Cargo.toml" \
              -- --test-threads=1 || true
          done

  fuzz-smoke:
    name: Fuzz smoke (5s per target)
    runs-on: ubuntu-24.04
    # Blocking merge gate. The three services expose lib targets (src/lib.rs +
    # run()), so the fuzz crate links expresso_{mail,calendar,contacts}::
    # fuzz_entry; build + 5s smoke-run of all four targets passed green on
    # commit 240e310d, so this is no longer continue-on-error.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      # No --locked: cargo-fuzz's pinned Cargo.lock can carry a `rustix` that
      # fails to build against the latest nightly (rustc_attrs reserved-attr
      # errors); letting cargo resolve fresh picks a compatible version.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --quiet
      # cargo-fuzz must run from the project root: it locates the fuzz crate at
      # ./fuzz and refuses a nested `fuzz/fuzz/Cargo.toml`. (Do NOT cd into fuzz/.)
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Smoke-run each target (5 s)
        run: |
          for target in fuzz_imip fuzz_sieve fuzz_ical fuzz_vcard; do
            cargo +nightly fuzz run "$target" -- -max_total_time=5
          done
