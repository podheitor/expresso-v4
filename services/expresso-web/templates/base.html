<!doctype html>
<html lang="pt-BR" id="expresso-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expresso{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script>
  // Apply theme immediately (before render) to avoid flash
  (function() {
    var t = localStorage.getItem('expresso_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    try {
      if (localStorage.getItem('expresso_density') === 'compact') {
        document.documentElement.classList.add('density-compact');
      }
    } catch(e){}
  })();
  </script>
  <style>
    .density-compact .msg-row-wrap, .density-compact .home-event-item,
    .density-compact .home-file-item, .density-compact .admin-user-row td,
    .density-compact .data-table td, .density-compact .data-table th { padding: .25rem .5rem !important; line-height: 1.2 !important; }
    .density-compact .card, .density-compact .subcard { padding: .55rem .75rem !important; }
    .density-compact .home-widget { padding: .6rem !important; }
    .density-compact .btn-sm { padding: .15rem .45rem !important; font-size: .78rem !important; }
  </style>
</head>
<body>
  <div id="maintenance-banner" style="display:none;padding:.35rem .75rem;font-size:.82rem;color:#fff;text-align:center"></div>
  {% block nav %}{% endblock %}
  {% block body %}{% endblock %}
  <!-- Atalhos de teclado globais (? para ajuda) -->
  <div id="shortcut-help" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);align-items:center;justify-content:center" onclick="this.style.display='none'">
    <div style="background:var(--bg-card,var(--bg));border-radius:var(--radius);padding:1.5rem 2rem;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.4)">
      <h3 style="margin-top:0">Atalhos de teclado</h3>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <tr><td class="mono" style="padding:.2rem .5rem">G M</td><td>Ir para Mail</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G C</td><td>Ir para Chat</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G A</td><td>Ir para Agenda</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G D</td><td>Ir para Drive</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G K</td><td>Ir para Contatos</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G T</td><td>Ir para Tarefas</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">G H</td><td>Ir para Início</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">/</td><td>Busca global</td></tr>
        <tr><td class="mono" style="padding:.2rem .5rem">?</td><td>Mostrar esta ajuda</td></tr>
      </table>
      <p class="muted small" style="margin-bottom:0">Clique em qualquer lugar para fechar.</p>
    </div>
  </div>
  <script>
  // Apply saved accent color
  (function() {
    var c = localStorage.getItem('expresso_accent_color');
    if (c) document.documentElement.style.setProperty('--accent', c);
  })();
  // Auto theme schedule
  (function() {
    try {
      var cfg = JSON.parse(localStorage.getItem('expresso_theme_schedule') || '{}');
      if (!cfg.enabled) return;
      var now = new Date(); var cur = now.getHours()*60+now.getMinutes();
      function toM(t){ var p=(t||'00:00').split(':'); return parseInt(p[0],10)*60+parseInt(p[1]||0,10); }
      var dm = toM(cfg.dark_at), lm = toM(cfg.light_at);
      var dark = dm > lm ? (cur >= dm || cur < lm) : (cur >= dm && cur < lm);
      var t = dark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
  // Maintenance banner
  (function() {
    try {
      var cfg = JSON.parse(localStorage.getItem('expresso_maintenance') || '{}');
      if (!cfg.enabled || !cfg.message) return;
      var banner = document.getElementById('maintenance-banner');
      if (!banner) return;
      var colors = { info: '#3b82f6', warn: '#f59e0b', error: '#ef4444' };
      banner.style.background = colors[cfg.level] || colors.info;
      banner.innerHTML = '📢 ' + String(cfg.message).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      banner.style.display = '';
    } catch(e) {}
  })();
  // Event reminders — poll every 30s, fire desktop notifications
  (function() {
    var SEEN_KEY = 'expresso_reminders_fired';
    function getFired() { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); } catch(e) { return {}; } }
    function markFired(k) { var f = getFired(); f[k] = Date.now(); try { localStorage.setItem(SEEN_KEY, JSON.stringify(f)); } catch(e){} }
    function checkReminders() {
      // Iterate over expresso_reminders_<eid> keys
      var now = Date.now();
      var fired = getFired();
      // Prune entries older than 24h
      Object.keys(fired).forEach(function(k){ if (now - fired[k] > 86400000) delete fired[k]; });
      try { localStorage.setItem(SEEN_KEY, JSON.stringify(fired)); } catch(e){}
      // Fetch upcoming events (next 24h) — use agenda cache if present
      var cache = null;
      try { cache = JSON.parse(localStorage.getItem('expresso_agenda_cache') || 'null'); } catch(e){}
      if (!cache || !Array.isArray(cache.events)) return;
      cache.events.forEach(function(ev) {
        if (!ev.id || !ev.start) return;
        var key = 'expresso_reminders_' + ev.id;
        var raw = localStorage.getItem(key);
        if (!raw) return;
        var mins; try { mins = JSON.parse(raw) || []; } catch(e) { return; }
        var startMs = new Date(ev.start).getTime();
        if (isNaN(startMs)) return;
        mins.forEach(function(m) {
          var fireAt = startMs - m * 60000;
          var fkey = ev.id + '_' + m;
          if (fired[fkey]) return;
          if (now >= fireAt && now < startMs + 60000) {
            markFired(fkey);
            notify(ev.summary || 'Evento', m === 0 ? 'Começando agora' : 'Em ' + m + ' min');
          }
        });
      });
    }
    function notify(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        try { new Notification(title, { body: body, icon: '/static/icon.png' }); } catch(e){}
      }
    }
    if ('Notification' in window && Notification.permission === 'default') {
      // Lazy-request once
      setTimeout(function() { Notification.requestPermission().catch(function(){}); }, 3000);
    }
    setInterval(checkReminders, 30000);
    setTimeout(checkReminders, 5000);
  })();
  // Theme toggle API (callable from any page)
  window.toggleTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('expresso_theme', next);
    document.querySelectorAll('[data-theme-label]').forEach(function(el){ el.textContent = next === 'dark' ? '☀ Claro' : '🌙 Escuro'; });
  };
  window.applyTheme = function(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('expresso_theme', t);
  };
  (function() {
    var _g = false;
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
      if (e.key === '/') {
        var search = document.getElementById('topbar-search');
        if (search) { e.preventDefault(); search.focus(); search.select(); }
        return;
      }
      if (e.key === '?') { document.getElementById('shortcut-help').style.display = 'flex'; return; }
      if (e.key === 'g' || e.key === 'G') { _g = true; setTimeout(function(){ _g = false; }, 1500); return; }
      if (_g) {
        _g = false;
        var nav = { m: '/mail', c: '/chat', a: '/calendar', d: '/drive', k: '/contacts', t: '/tasks', h: '/' };
        var k = e.key.toLowerCase();
        if (nav[k]) { window.location.href = nav[k]; }
      }
    });
  })();
  </script>
</body>
</html>
