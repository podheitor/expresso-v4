[package]
name = "expresso-mail"
publish = false
version = "0.1.0"
edition = "2021"
description = "SMTP/IMAP server + webmail API"

[[bin]]
name = "expresso-mail"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
prometheus = { workspace = true }
once_cell = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
lettre = { workspace = true }
mail-parser = { workspace = true }
sieve-rs  = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
base64 = { workspace = true }
imap-codec = { workspace = true }
imap-types = { workspace = true }
chrono = { workspace = true }

# Internal libs
expresso-core = { path = "../../libs/expresso-core", package = "expresso-core" }
expresso-observability = { workspace = true }
expresso-mail-auth   = { path = "../../libs/expresso-mail-auth", package = "expresso-mail-auth" }
expresso-storage = { path = "../../libs/expresso-storage", package = "expresso-storage" }
expresso-auth-client = { path = "../../libs/expresso-auth-client", package = "expresso-auth-client" }
sqlx = { workspace = true }

[features]
fuzzing = ["dep:tempfile"]

[dependencies.tempfile]
version  = "3"
optional = true

[dev-dependencies]
tokio-test = "0.4"

[package.metadata.cargo-machete]
# Used via macros/features/lib-rename that machete's source scan can't see.
ignored = ["async-trait", "sieve-rs", "tempfile"]
